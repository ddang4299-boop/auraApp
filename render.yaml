# Cấu hình triển khai AURA lên Render (https://render.com) — dùng mục "New > Blueprint".
# Render đọc file này, tự cài thư viện và chạy app. Các key có "sync: false" sẽ được hỏi
# khi tạo, nhập trên web Render, KHÔNG ghi vào đây.
services:
  - type: web
    name: aura
    runtime: python
    plan: free
    region: singapore        # gần Việt Nam nhất -> ít trễ; KHÔNG đổi được sau khi đã tạo dịch vụ
    buildCommand: pip install -r requirements-server.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.10
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_FALLBACK
        value: "groq,groq:openai/gpt-oss-20b,openrouter,openai"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: LLM_TIMEOUT
        value: "5"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # tuỳ chọn: OpenRouter (key bắt đầu bằng sk-or-) và OpenAI (cần nạp tín dụng)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Đăng nhập Google (OAuth client loại "Web application", redirect URI:
      # https://<link-render>/oauth_callback). Client ID là công khai; secret thì nhập trên Render.
      - key: GOOGLE_CLIENT_ID
        value: 707169689924-rm36rpd5j7i0eas6f98g8m05dk71o78h.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
