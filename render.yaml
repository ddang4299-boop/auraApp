# Cấu hình triển khai AURA lên Render (https://render.com) — dùng mục "New > Blueprint".
# Render đọc file này, tự cài thư viện và chạy app. Các key có "sync: false" sẽ được hỏi
# khi tạo, nhập trên web Render, KHÔNG ghi vào đây.
services:
  - type: web
    name: aura
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.10
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_FALLBACK
        value: groq
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: LLM_TIMEOUT
        value: "8"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
