<!DOCTYPE html>
<html lang="vi">

<head>
  <!-- Trang khung của bản web AURA (Flet tự chèn cấu hình vào chỗ "fletAppConfig").
       Dựa trên index.html mặc định của flet-web 1.0.5, chỉnh cho iPhone (tai thỏ / Dynamic Island):
       - nền kem cho cả trang và màu chủ đạo (theme-color) trùng nền app, để vùng quanh tai thỏ,
         thanh trạng thái và thanh trình duyệt cùng màu với app thay vì trắng / hồng Flet;
       - thanh trạng thái sáng chữ tối khi "Thêm vào MH chính";
       - tên, mô tả, biểu tượng, màn chờ của AURA thay cho Flet.
       Nội dung luôn nằm trong vùng an toàn: Flutter tự đặt thẻ viewport không có viewport-fit=cover,
       nên tai thỏ / Dynamic Island / thanh Home không che giao diện. -->
  <base href="/">

  <meta charset="UTF-8">
  <!-- cho màn chờ hiện đúng cỡ trên điện thoại; khi app chạy, Flutter tự thay bằng thẻ viewport của nó -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AURA: cùng nhìn chậm tranh Phục Hưng qua đối thoại.">

  <!-- màu thanh trình duyệt / vùng quanh Dynamic Island = nền app -->
  <meta name="theme-color" content="#F6F2E8">
  <meta name="color-scheme" content="light">

  <!-- iOS: khi thêm vào màn hình chính -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AURA">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png" />

  <title>AURA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      background-color: #F6F2E8;      /* vùng ngoài app (tai thỏ, kéo quá đà) cùng màu kem */
      overscroll-behavior: none;     /* không kéo cả trang lên xuống như trang web */
    }
  </style>

  <script>
    // Giữ nguyên từ bản gốc của Flet: Safari/iOS khôi phục trang từ bộ nhớ đệm thì nạp lại,
    // nếu không app sẽ đứng hình (phiên Flet nằm trên máy chủ nên không mất trạng thái).
    window.addEventListener('pageshow', (event) => {
      if (event.persisted &&
        navigator.vendor && navigator.vendor.startsWith('Apple')) {
        window.location.reload();
      }
    });
  </script>

  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: null,
      pyodideUrl: "/pyodide/pyodide.mjs",
      webRenderer: "auto",
      fontFallbackBaseUrl: null,
      appPackageUrl: "app.tar.gz"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
    });
  </script>

  <!-- fletAppConfig -->

  <script src="python.js"></script>
  <!-- Khung quét tranh trực tiếp (camera + khung ngắm + Thư viện ảnh) cho nút Scan, xem assets/aura-scan.js.
       Phải nạp trước Flutter để kịp "đón" lệnh mở hộp chọn ảnh. -->
  <script src="aura-scan.js?v=1"></script>
</head>

<body>
  <!-- Màn chờ AURA. Thanh tiến trình đi theo các bước tải THẬT của trình duyệt:
       trang đã tới (máy chủ đã thức) -> tải bộ hiển thị Flutter -> tải bộ vẽ -> khung hình đầu tiên.
       Giữa các bước thanh nhích chậm để không đứng im; chờ lâu thì báo rõ lý do. -->
  <div id="aura-splash" role="status" aria-live="polite" aria-label="Đang mở AURA">
    <style>
      #aura-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; padding: 24px;
        background:
          radial-gradient(60vmax 60vmax at 105% -10%, #EBD7D3 0%, rgba(235,215,211,0) 60%),
          radial-gradient(70vmax 70vmax at -10% 108%, #EEDFC2 0%, rgba(238,223,194,0) 62%),
          #F6F2E8;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        transition: opacity .45s ease;
      }
      #aura-splash.done { opacity: 0; pointer-events: none; }
      #aura-splash .logo { width: 250px; max-width: 68vw; height: auto; }

      #aura-splash .progress { width: 240px; max-width: 70vw; margin-top: 8px; }
      #aura-splash .track { height: 3px; border-radius: 2px; background: #E4DCCD; overflow: hidden; }
      #aura-splash .fill {
        height: 100%; width: 0%; border-radius: 2px;
        background: linear-gradient(90deg, #8E4352, #772F3D);
        transition: width .35s ease;
      }
      #aura-splash .meta { display: flex; justify-content: space-between; margin-top: 9px; gap: 12px; }
      #aura-splash .status { color: #772F3D; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      #aura-splash .pct { color: #796E64; font-size: 11px; font-variant-numeric: tabular-nums; }
      #aura-splash .hint { color: #796E64; font-size: 12.5px; line-height: 1.5; text-align: center; max-width: 300px; min-height: 38px; }
      #aura-splash .hint a { color: #772F3D; }

    </style>
    <img class="logo" src="images/logo_splash.png" alt="AURA">
    <div class="progress">
      <div class="track"><div class="fill" id="aura-fill"></div></div>
      <div class="meta"><span class="status" id="aura-status">Đã kết nối máy chủ</span><span class="pct" id="aura-pct">0%</span></div>
    </div>
    <div class="hint" id="aura-hint"></div>
  </div>

  <script>
    (function () {
      var fill = document.getElementById('aura-fill');
      var pct = document.getElementById('aura-pct');
      var statusEl = document.getElementById('aura-status');
      var hint = document.getElementById('aura-hint');
      var splash = document.getElementById('aura-splash');
      // bước tải: [mức tối thiểu khi đạt bước, mức trần trước bước kế, chữ trạng thái]
      var STEPS = {
        page:     [12, 45, 'Đang tải bộ hiển thị'],
        engine:   [55, 78, 'Đang dựng phòng trưng bày'],
        renderer: [80, 96, 'Đang mở tác phẩm'],
        ready:    [100, 100, 'Sẵn sàng']
      };
      var value = 0, cap = 0, finished = false, t0 = Date.now();

      function setStep(name) {
        var s = STEPS[name];
        if (!s || s[0] < value && name !== 'ready') { if (s) cap = Math.max(cap, s[1]); return; }
        value = Math.max(value, s[0]); cap = Math.max(cap, s[1]);
        statusEl.textContent = s[2];
        draw();
      }
      function draw() {
        fill.style.width = value.toFixed(1) + '%';
        pct.textContent = Math.round(value) + '%';
      }
      setStep('page');

      // Theo dõi các tệp lớn của Flutter tải xong
      try {
        new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (e) {
            var n = e.name || '';
            if (/main\.dart\.(js|mjs|wasm)/.test(n)) setStep('engine');
            else if (/canvaskit|skwasm/.test(n) && /\.wasm/.test(n)) setStep('renderer');
          });
        }).observe({ type: 'resource', buffered: true });
      } catch (err) { /* trình duyệt cũ: chỉ dùng thanh nhích dần */ }

      // Nhích chậm dần về mức trần của bước hiện tại để thanh không đứng im
      var tick = setInterval(function () {
        if (finished) return clearInterval(tick);
        if (value < cap - 0.5) { value += Math.max(0.15, (cap - value) * 0.035); draw(); }
        var waited = (Date.now() - t0) / 1000;
        // Mở nhanh (máy chủ đang thức) thì không hiện gì; chờ lâu mới giải thích, tăng dần theo thời gian.
        if (waited > 45) {
          hint.innerHTML = 'Mạng đang chậm hoặc máy chủ đang bận. Bạn có thể <a href="">tải lại trang</a>.';
        } else if (waited > 12) {
          hint.textContent = 'Server đang khởi động và trình duyệt đang tải bộ hiển thị (vài MB). Những lần sau sẽ nhanh hơn, cảm ơn bạn đã kiên nhẫn chờ.';
        } else if (waited > 2.5) {
          hint.textContent = 'Server đang khởi động lần đầu, có thể mất một chút thời gian…';
        }
      }, 120);

      window.addEventListener('flutter-first-frame', function () {
        setStep('ready');
        finished = true;
        // chờ giao diện AURA kịp hiện nội dung rồi mới mờ màn chờ
        setTimeout(function () {
          splash.classList.add('done');
          setTimeout(function () { splash.remove(); }, 500);
        }, 650);
      }, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
